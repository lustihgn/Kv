<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Particle Heart – Build From Center</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  background: black;
  overflow: hidden;
}
canvas { display: block; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let w, h;
function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

const COUNT = 6000;
const particles = [];

/* ===== HÌNH TIM GIỮ NGUYÊN ===== */
function heart(t){
  return {
    x: 16 * Math.sin(t)**3,
    y: -(13*Math.cos(t)
        - 5*Math.cos(2*t)
        - 2*Math.cos(3*t)
        - Math.cos(4*t))
  };
}

/* ===== PHÂN BỐ HẠT GIỮ NGUYÊN ===== */
function generate(){
  particles.length = 0;

  while(particles.length < COUNT){
    const a = Math.random() * Math.PI * 2;
    const k = Math.pow(Math.random(), 0.35);
    const p = heart(a);

    const center = Math.abs(p.x * k);
    if(Math.random() > Math.min(1, Math.pow(center / 1.0, 0.85))) continue;

    const baseO = 0.25 + k * 0.55;

    particles.push({
      nx: p.x * k,
      ny: p.y * k,
      r: 0.028 + k * 0.085,
      baseO,
      phase: Math.random() * Math.PI * 2,
      speed: 0.006 + Math.random() * 0.01
    });
  }
}
generate();

/* ===== HIỆU ỨNG XUẤT HIỆN ===== */
let build = 0;
const buildSpeed = 0.004; // chỉnh tốc độ ở đây
let building = true;

function ease(t){
  return t * t * (3 - 2 * t); // smoothstep
}

let lastTime = 0;

function draw(now){
  requestAnimationFrame(draw);
  if(now - lastTime < 16) return;
  lastTime = now;

  ctx.clearRect(0,0,w,h);

  /* ===== CẬP NHẬT XÂY HÌNH ===== */
  if(building){
    build += buildSpeed;
    if(build >= 1){
      build = 1;
      building = false; // 🔒 tắt hoàn toàn logic xây hình
    }
  }

  const a = ease(build);

  /* ===== NHỊP TIM GIỮ NGUYÊN ===== */
  const t = now * 0.0025;
  const beat =
    1 + Math.sin(t) * 0.03 + Math.sin(t*2) * 0.012;

  ctx.save();
  ctx.translate(w/2, h/2);
  ctx.scale(13 * beat, 13 * beat); // ⚠️ KHÔNG nhân với a

  for(const p of particles){
    p.phase += p.speed;

    const sparkle = (Math.sin(p.phase) + 1) * 0.12;
    const pulse = (beat - 1) * 0.6;

    /* ===== HẠT BAY TỪ TÂM RA NGOÀI ===== */
    const x = p.nx * a;
    const y = p.ny * a;

    const dx = x * pulse;
    const dy = y * pulse;

    ctx.globalAlpha = (p.baseO + sparkle) * a;

    ctx.beginPath();
    ctx.arc(
      x + dx,
      y + dy,
      p.r,
      0,
      Math.PI * 2
    );
    ctx.fillStyle = "rgb(255,105,135)";
    ctx.fill();
  }

  ctx.restore();
  ctx.globalAlpha = 1;
}

requestAnimationFrame(draw);
</script>

</body>
</html>
